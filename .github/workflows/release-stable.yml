name: Desktop Stable Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true
      publish_live:
        description: "Publish the GitHub stable release and gh-pages manifests"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

env:
  CARGO_TERM_COLOR: always
  AURA_UPDATE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

      - name: Install Node.js
        uses: ./.github/actions/setup-node

      - name: Run release preflight
        run: node scripts/ci/verify-release-preflight.mjs

  build-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: ./.github/actions/setup-node
        with:
          cache: npm
          cache-dependency-path: interface/package-lock.json

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build interface
        working-directory: interface
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_COMMIT: ${{ github.sha }}
          APP_CHANNEL: stable
          # The shipped desktop frontend is built here and consumed by the
          # `package` job via the prebuilt-frontend path, so the Mixpanel
          # token must be baked in at *this* step. Without it the client SDK
          # silently no-ops (no session_active / engagement events).
          VITE_MIXPANEL_TOKEN: ${{ vars.VITE_MIXPANEL_TOKEN }}
        run: |
          npm ci
          npm run build
          node ../infra/scripts/release/desktop-frontend-assets-validate.mjs --dist dist --require-analytics

      - name: Upload interface dist
        uses: actions/upload-artifact@v5
        with:
          name: interface-dist-stable
          path: interface/dist
          compression-level: 0

  build-sidecar:
    env:
      CARGO_TARGET_DIR: ../.aura-shared-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x86_64
          - os: macos-latest
            target: macos
            arch: aarch64
          - os: macos-15-intel
            target: macos
            arch: x86_64
          - os: windows-latest
            target: windows
            arch: x86_64

    runs-on: ${{ matrix.os == 'windows-latest' && 'aura-os-windows-x64-large' || matrix.os == 'ubuntu-latest' && 'aura-os-linux-x64-large' || matrix.os == 'macos-15-intel' && 'macos-15-large' || matrix.os == 'macos-latest' && 'macos-15-xlarge' || matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Prepare harness sibling workspace
        uses: ./.github/actions/setup-harness-sibling
        with:
          repository-owner: ${{ github.repository_owner }}
          include-harness: "true"

      - name: Restore bundled sidecar binary cache
        id: sidecar-binary-cache
        uses: actions/cache@v4
        with:
          path: apps/aura-os-desktop/resources/sidecar
          key: desktop-sidecar-bin-v1-${{ matrix.target }}-${{ matrix.arch }}-${{ hashFiles('aura-harness/Cargo.lock', 'aura-harness/Cargo.toml', 'aura-harness/crates/**/Cargo.toml', 'aura-harness/crates/**/*.rs') }}

      - name: Validate cached sidecar binary
        if: steps.sidecar-binary-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          binary="apps/aura-os-desktop/resources/sidecar/aura-node"
          if [ "${{ matrix.target }}" = "windows" ]; then
            binary="${binary}.exe"
          fi
          test -s "$binary"

      - name: Install Rust toolchain
        if: steps.sidecar-binary-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-rust-toolchain

      - name: Restore sidecar Rust cache
        if: steps.sidecar-binary-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-sidecar-v4-${{ runner.os }}-${{ runner.arch }}
          workspaces: |
            ../aura-harness -> ../.aura-shared-target
          cache-on-failure: true

      - name: Set up sccache
        if: steps.sidecar-binary-cache.outputs.cache-hit != 'true'
        id: sccache-sidecar
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - name: Configure sccache backend
        if: steps.sidecar-binary-cache.outputs.cache-hit != 'true' && steps.sccache-sidecar.outcome == 'success'
        shell: bash
        env:
          DEPOT_CACHE_TOKEN: ${{ secrets.DEPOT_CACHE_TOKEN }}
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
          if [ -n "$DEPOT_CACHE_TOKEN" ]; then
            echo "SCCACHE_WEBDAV_ENDPOINT=https://cache.depot.dev" >> "$GITHUB_ENV"
            echo "SCCACHE_WEBDAV_TOKEN=$DEPOT_CACHE_TOKEN" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Install Linux runner dependencies
        if: steps.sidecar-binary-cache.outputs.cache-hit != 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config libatomic1 libssl-dev libdbus-1-dev libpipewire-0.3-dev

      - name: Install Node.js
        if: steps.sidecar-binary-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-node

      - name: Verify runner architecture
        if: steps.sidecar-binary-cache.outputs.cache-hit != 'true' && matrix.target == 'linux'
        shell: bash
        run: |
          actual_arch="$(uname -m)"
          expected_arch="${{ matrix.arch }}"
          if [ "$actual_arch" != "$expected_arch" ]; then
            echo "Expected Linux runner architecture $expected_arch but got $actual_arch" >&2
            exit 1
          fi

      - name: Check desktop runtime parity
        if: steps.sidecar-binary-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/check-runtime.mjs desktop --require-harness

      - name: Validate desktop auto-update sidecar contract
        if: steps.sidecar-binary-cache.outputs.cache-hit != 'true'
        run: |
          node --test infra/scripts/release/prepare-desktop-sidecar.test.mjs
          node infra/scripts/release/prepare-desktop-sidecar.mjs --check

      - name: Build bundled aura-node sidecar
        if: steps.sidecar-binary-cache.outputs.cache-hit != 'true'
        run: node infra/scripts/release/prepare-desktop-sidecar.mjs

      - name: Archive bundled sidecar
        shell: bash
        run: |
          tar -cf desktop-sidecar.tar -C apps/aura-os-desktop/resources sidecar

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v5
        with:
          name: sidecar-${{ matrix.target }}-${{ matrix.arch }}
          path: desktop-sidecar.tar
          compression-level: 0

  package:
    needs: release-preflight
    environment: production
    env:
      CARGO_TARGET_DIR: ../.aura-shared-target
      AURA_RELEASE_DIR: ../.aura-shared-target/release
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      MACOS_DEVELOPER_TEAM_ID: ${{ secrets.MACOS_DEVELOPER_TEAM_ID }}
      IOS_APP_STORE_CONNECT_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_ID }}
      IOS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
      IOS_APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_BASE64 }}
      AURA_NETWORK_URL: ${{ vars.AURA_NETWORK_URL || 'https://aura-network.onrender.com' }}
      AURA_STORAGE_URL: ${{ vars.AURA_STORAGE_URL || 'https://aura-storage.onrender.com' }}
      AURA_INTEGRATIONS_URL: ${{ vars.AURA_INTEGRATIONS_URL || 'https://aura-integrations.onrender.com' }}
      AURA_ROUTER_URL: ${{ vars.AURA_ROUTER_URL || 'https://aura-router.onrender.com' }}
      Z_BILLING_URL: ${{ vars.Z_BILLING_URL || 'https://z-billing.onrender.com' }}
      ORBIT_BASE_URL: ${{ vars.ORBIT_BASE_URL || 'https://orbit-sfvu.onrender.com' }}
      AURA_PLATFORM_TOOL_ACTION_BASE_URL: ${{ vars.AURA_PLATFORM_TOOL_ACTION_BASE_URL || 'https://api.aura.ai' }}
      SWARM_BASE_URL: ${{ vars.SWARM_BASE_URL || 'http://ab6d2375031e74ce1976fdf62ea951a4-e757483aaffba396.elb.us-east-2.amazonaws.com' }}
      REQUIRE_ZERO_PRO: ${{ vars.REQUIRE_ZERO_PRO }}
      AURA_DISABLE_LOCAL_HARNESS_AUTOSPAWN: ${{ vars.AURA_DISABLE_LOCAL_HARNESS_AUTOSPAWN }}
      # NOTE: This job no longer builds the frontend (it consumes the prebuilt
      # dist from `build-interface`), so the *client* token VITE_MIXPANEL_TOKEN
      # is baked in `build-interface`, not here. MIXPANEL_TOKEN below is the
      # *server-side* token for the bundled local aura-os-server, the sole
      # emitter of session_active (True DAU) on desktop. Same public
      # project-token value; without it desktop True DAU is silently dropped.
      MIXPANEL_TOKEN: ${{ vars.VITE_MIXPANEL_TOKEN }}
      Z_BILLING_API_KEY: ${{ secrets.Z_BILLING_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            arch: x86_64
          - os: macos-latest
            target: macos
            arch: aarch64
          - os: macos-15-intel
            target: macos
            arch: x86_64
          - os: windows-latest
            target: windows
            arch: x86_64

    runs-on: ${{ matrix.os == 'windows-latest' && 'aura-os-windows-x64-large' || matrix.os == 'ubuntu-latest' && 'aura-os-linux-x64-large' || matrix.os == 'macos-15-intel' && 'macos-15-large' || matrix.os == 'macos-latest' && 'macos-15-xlarge' || matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: ./.github/actions/setup-rust-toolchain

      - name: Restore desktop Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-app-v3-${{ runner.os }}-${{ runner.arch }}
          workspaces: |
            . -> ../.aura-shared-target
          cache-on-failure: true

      - name: Set up sccache
        id: sccache-package
        uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true

      - name: Configure sccache backend
        if: steps.sccache-package.outcome == 'success'
        shell: bash
        env:
          DEPOT_CACHE_TOKEN: ${{ secrets.DEPOT_CACHE_TOKEN }}
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
          if [ -n "$DEPOT_CACHE_TOKEN" ]; then
            echo "SCCACHE_WEBDAV_ENDPOINT=https://cache.depot.dev" >> "$GITHUB_ENV"
            echo "SCCACHE_WEBDAV_TOKEN=$DEPOT_CACHE_TOKEN" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          fi

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config libatomic1 libssl-dev libdbus-1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libpipewire-0.3-dev libgbm-dev libxdo-dev

      - name: Install Node.js
        uses: ./.github/actions/setup-node

      - name: Verify runner architecture
        if: matrix.target == 'linux'
        shell: bash
        run: |
          actual_arch="$(uname -m)"
          expected_arch="${{ matrix.arch }}"
          if [ "$actual_arch" != "$expected_arch" ]; then
            echo "Expected Linux runner architecture $expected_arch but got $actual_arch" >&2
            exit 1
          fi

      - name: Check desktop runtime parity
        run: node scripts/ci/check-runtime.mjs desktop

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch Cargo.toml version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" apps/aura-os-desktop/Cargo.toml
          rm -f apps/aura-os-desktop/Cargo.toml.bak

      - name: Install cargo-packager
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-packager
          version: 0.11.8

      - name: Prepare packager config
        shell: bash
        run: |
          node scripts/ci/patch-desktop-packager-config.mjs \
            --binaries-dir "../../../.aura-shared-target/release" \
            --strip-before-packaging

      - name: Disable Spotlight indexing for DMG packaging
        if: matrix.target == 'macos'
        shell: bash
        # Spotlight (mds / mdworker_shared) holds open file handles on freshly
        # mounted DMGs, which makes `hdiutil detach` fail with `Resource busy`
        # at the end of `create-dmg`. Disabling indexing for the runner keeps
        # cargo-packager's DMG step from getting wedged.
        run: |
          sudo mdutil -a -i off || true
          sudo mdutil -i off /Volumes || true

      - name: Clean stale macOS DMG mounts
        if: matrix.target == 'macos'
        shell: bash
        run: python3 infra/scripts/release/cleanup-stale-macos-dmg.py

      - name: Install patched create-dmg script
        if: matrix.target == 'macos'
        shell: bash
        # cargo-packager 0.11.8 only downloads upstream create-dmg v1.1.1 if the
        # cache file does not exist. Pre-seeding the cache with our patched copy
        # (-nobrowse on attach, -force on detach retries) is what fixes the
        # recurring `hdiutil: couldn't eject ... Resource busy` failure on the
        # macOS Intel runner.
        run: bash infra/scripts/release/install-patched-create-dmg.sh

      - name: Prepare macOS signing inputs
        if: matrix.target == 'macos'
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          required = [
              "MACOS_DEVELOPER_ID_P12_BASE64",
              "MACOS_DEVELOPER_ID_P12_PASSWORD",
              "IOS_APP_STORE_CONNECT_KEY_ID",
              "IOS_APP_STORE_CONNECT_ISSUER_ID",
              "IOS_APP_STORE_CONNECT_KEY_BASE64",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required macOS signing secrets: {', '.join(missing)}")

          temp_dir = Path(tempfile.mkdtemp(prefix="aura-macos-signing-"))
          p12_path = temp_dir / "developer-id.p12"
          p8_path = temp_dir / f"AuthKey_{os.environ['IOS_APP_STORE_CONNECT_KEY_ID']}.p8"

          p12_path.write_bytes(base64.b64decode(os.environ["MACOS_DEVELOPER_ID_P12_BASE64"]))
          p8_path.write_bytes(base64.b64decode(os.environ["IOS_APP_STORE_CONNECT_KEY_BASE64"]))

          pem = subprocess.run(
              [
                  "openssl",
                  "pkcs12",
                  "-in",
                  str(p12_path),
                  "-clcerts",
                  "-nokeys",
                  "-passin",
                  f"pass:{os.environ['MACOS_DEVELOPER_ID_P12_PASSWORD']}",
              ],
              check=True,
              capture_output=True,
              text=True,
          ).stdout

          subject = subprocess.run(
              ["openssl", "x509", "-noout", "-subject", "-nameopt", "RFC2253"],
              input=pem,
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()

          match = re.search(r"CN=((?:\\.|[^,])+)", subject)
          if not match:
              raise SystemExit(f"Unable to derive signing identity from certificate subject: {subject}")
          signing_identity = re.sub(r"\\(.)", r"\1", match.group(1))

          env_path = Path(os.environ["GITHUB_ENV"])
          with env_path.open("a", encoding="utf-8") as fh:
              fh.write(f"APPLE_CERTIFICATE={os.environ['MACOS_DEVELOPER_ID_P12_BASE64']}\n")
              fh.write(f"APPLE_CERTIFICATE_PASSWORD={os.environ['MACOS_DEVELOPER_ID_P12_PASSWORD']}\n")
              fh.write(f"APPLE_API_KEY={os.environ['IOS_APP_STORE_CONNECT_KEY_ID']}\n")
              fh.write(f"APPLE_API_ISSUER={os.environ['IOS_APP_STORE_CONNECT_ISSUER_ID']}\n")
              fh.write(f"APPLE_API_KEY_PATH={p8_path}\n")
              fh.write(f"MACOS_SIGNING_IDENTITY={signing_identity}\n")
          PY

      - name: Inject macOS signing identity into packager config
        if: matrix.target == 'macos'
        shell: bash
        run: |
          node scripts/ci/patch-desktop-packager-config.mjs \
            --macos-signing-identity-env MACOS_SIGNING_IDENTITY

      - name: Validate macOS packager manifest
        if: matrix.target == 'macos'
        run: cargo metadata --no-deps --manifest-path apps/aura-os-desktop/Cargo.toml > /dev/null

      - name: Wait for platform build artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/wait-gh-artifacts.mjs \
            --artifact "interface-dist-stable" \
            --artifact "sidecar-${{ matrix.target }}-${{ matrix.arch }}" \
            --interval-seconds 5 \
            --fail-job "build-interface" \
            --fail-job "build-sidecar (${{ matrix.os }}, ${{ matrix.target }}, ${{ matrix.arch }})"

      - name: Download sidecar artifact
        uses: actions/download-artifact@v5
        with:
          name: sidecar-${{ matrix.target }}-${{ matrix.arch }}
          path: downloaded-sidecar

      - name: Download interface dist
        uses: actions/download-artifact@v5
        with:
          name: interface-dist-stable
          path: interface/dist

      - name: Restore packaged resources
        shell: bash
        run: |
          rm -rf apps/aura-os-desktop/resources/sidecar
          mkdir -p apps/aura-os-desktop/resources
          tar -xf downloaded-sidecar/desktop-sidecar.tar -C apps/aura-os-desktop/resources
          test -d apps/aura-os-desktop/resources/sidecar
          test -d interface/dist
          node infra/scripts/release/desktop-frontend-assets-validate.mjs --dist interface/dist
          if [ "${{ matrix.target }}" != "windows" ]; then
            chmod 755 apps/aura-os-desktop/resources/sidecar/aura-node
          fi

      - name: Build release binary
        env:
          AURA_DESKTOP_USE_PREBUILT_FRONTEND: "1"
          AURA_UPDATE_BASE_URL: ${{ env.AURA_UPDATE_BASE_URL }}
          UPDATER_PUBLIC_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PUBLIC_KEY }}
        shell: bash
        run: |
          cargo build --release --no-default-features --features stable-channel --package aura-os-desktop

      - name: Verify release binary channel
        shell: bash
        run: |
          node scripts/ci/verify-desktop-release-binary.mjs \
            --release-dir "$AURA_RELEASE_DIR" \
            --target "${{ matrix.target }}" \
            --expected-channel Stable

      - name: Run desktop release observability probes
        id: desktop_observability
        if: matrix.target == 'macos' && matrix.arch == 'aarch64'
        continue-on-error: true
        timeout-minutes: 12
        env:
          AURA_DESKTOP_BINARY: ${{ env.AURA_RELEASE_DIR }}/aura-os-desktop
          AURA_STATUS_USER_EMAIL: ${{ secrets.AURA_STATUS_USER_EMAIL }}
          AURA_STATUS_USER_PASSWORD: ${{ secrets.AURA_STATUS_USER_PASSWORD }}
          AURA_STATUS_ENVIRONMENT: desktop-stable-${{ matrix.target }}-${{ matrix.arch }}
          AURA_STATUS_RUNTIME_ENVIRONMENT: desktop-release
          AURA_STATUS_CHECKS_DIR: desktop-observability-checks
          AURA_STATUS_DESKTOP_LOG_DIR: desktop-observability-logs
          AURA_STATUS_DESKTOP_CHECKS: api-health,auth-session,orgs-list,user-profile,workspace-defaults,terminal-list,desktop-update-runtime,local-agent-create,local-agent-runtime,local-agent-permissions,project-agent-chat-stream,project-agent-tool-roundtrip,project-agent-a2a-roundtrip,project-agent-subagent-roundtrip,session-share-public-read,harness-memory-roundtrip,harness-skills-roundtrip,harness-skill-invocation,notes-crud,process-run-lifecycle,model-matrix,image-generation-stream,analytics-contract-artifacts
        shell: bash
        run: |
          if [ -z "$AURA_STATUS_USER_EMAIL" ] || [ -z "$AURA_STATUS_USER_PASSWORD" ]; then
            echo "Skipping desktop observability probes because AURA_STATUS_USER_EMAIL/AURA_STATUS_USER_PASSWORD are not configured."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          npm run status:desktop-release

      - name: Run production web observability probes
        if: always() && matrix.target == 'macos' && matrix.arch == 'aarch64' && steps.desktop_observability.outputs.ran == 'true'
        continue-on-error: true
        timeout-minutes: 12
        env:
          AURA_STATUS_API_BASE_URL: ${{ secrets.AURA_STATUS_API_BASE_URL || vars.AURA_STATUS_API_BASE_URL || 'https://api.aura.ai' }}
          AURA_STATUS_PUBLIC_BASE_URL: ${{ secrets.AURA_STATUS_PUBLIC_BASE_URL || vars.AURA_STATUS_PUBLIC_BASE_URL || 'https://aura.ai' }}
          AURA_STATUS_ACCESS_TOKEN: ${{ secrets.AURA_STATUS_ACCESS_TOKEN }}
          AURA_STATUS_USER_EMAIL: ${{ secrets.AURA_STATUS_USER_EMAIL }}
          AURA_STATUS_USER_PASSWORD: ${{ secrets.AURA_STATUS_USER_PASSWORD }}
          AURA_STATUS_MODEL_IDS: ${{ secrets.AURA_STATUS_MODEL_IDS || vars.AURA_STATUS_MODEL_IDS }}
          AURA_STATUS_IMAGE_MODEL: ${{ secrets.AURA_STATUS_IMAGE_MODEL || vars.AURA_STATUS_IMAGE_MODEL }}
          AURA_STATUS_ENVIRONMENT: production
          AURA_STATUS_RUNTIME_ENVIRONMENT: production-api
          AURA_STATUS_CHECKS_DIR: desktop-observability-checks
          AURA_STATUS_CHECKS: >-
            api-health,auth-session,auth-validate,system-info,
            orgs-list,user-profile,org-integrations-list,org-tool-actions-list,
            org-tool-actions-contract,billing-status,credits-balance,
            billing-account-transactions,project-crud,spec-task-crud,
            project-stats,loop-status,notes-crud,process-list,process-crud,
            marketplace-agents,harness-health,active-streams,debug-projects,
            feedback-list,bug-reports-mine,feed-list,leaderboard,platform-stats,
            remote-agent-create,remote-agent-state,remote-agent-runtime,
            eval-summary-artifacts,analytics-contract-artifacts,
            public-setup,public-chat-stream,public-feedback-api,
            public-blog-api,public-content-details,public-x402-models,public-x402-payment-challenge,
            published-observability-snapshot,public-observability-page,
            public-models-page,public-marketing-pages
        shell: bash
        run: npm run status:probes

      - name: Run desktop observability investigations
        if: always() && matrix.target == 'macos' && matrix.arch == 'aarch64' && steps.desktop_observability.outputs.ran == 'true'
        timeout-minutes: 10
        env:
          AURA_STATUS_CHECKS_DIR: desktop-observability-checks
          AURA_STATUS_INVESTIGATIONS_DIR: desktop-observability-investigations
          AURA_STATUS_INVESTIGATOR_PROVIDER: ${{ secrets.AURA_STATUS_INVESTIGATOR_PROVIDER || vars.AURA_STATUS_INVESTIGATOR_PROVIDER || 'anthropic' }}
          AURA_STATUS_INVESTIGATOR_BASE_URL: ${{ secrets.AURA_STATUS_INVESTIGATOR_BASE_URL || vars.AURA_STATUS_INVESTIGATOR_BASE_URL }}
          AURA_STATUS_INVESTIGATOR_API_KEY: ${{ secrets.AURA_STATUS_INVESTIGATOR_API_KEY }}
          AURA_STATUS_INVESTIGATOR_MODEL: ${{ secrets.AURA_STATUS_INVESTIGATOR_MODEL || vars.AURA_STATUS_INVESTIGATOR_MODEL || vars.CHANGELOG_ANTHROPIC_MODEL || vars.CHANGELOG_MEDIA_ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AURA_STATUS_ENVIRONMENT: production
          AURA_STATUS_SOURCE: desktop-stable-release
        run: npm run status:investigate

      - name: Run desktop observability learning
        if: always() && matrix.target == 'macos' && matrix.arch == 'aarch64' && steps.desktop_observability.outputs.ran == 'true'
        timeout-minutes: 10
        env:
          AURA_STATUS_CHECKS_DIR: desktop-observability-checks
          AURA_STATUS_INVESTIGATIONS_DIR: desktop-observability-investigations
          AURA_STATUS_LESSONS_DIR: desktop-observability-lessons
          AURA_STATUS_LEARNING_PROVIDER: ${{ secrets.AURA_STATUS_LEARNING_PROVIDER || vars.AURA_STATUS_LEARNING_PROVIDER || secrets.AURA_STATUS_INVESTIGATOR_PROVIDER || vars.AURA_STATUS_INVESTIGATOR_PROVIDER || 'anthropic' }}
          AURA_STATUS_LEARNING_BASE_URL: ${{ secrets.AURA_STATUS_LEARNING_BASE_URL || vars.AURA_STATUS_LEARNING_BASE_URL || secrets.AURA_STATUS_INVESTIGATOR_BASE_URL || vars.AURA_STATUS_INVESTIGATOR_BASE_URL }}
          AURA_STATUS_LEARNING_API_KEY: ${{ secrets.AURA_STATUS_LEARNING_API_KEY || secrets.AURA_STATUS_INVESTIGATOR_API_KEY || secrets.ANTHROPIC_API_KEY }}
          AURA_STATUS_LEARNING_MODEL: ${{ secrets.AURA_STATUS_LEARNING_MODEL || vars.AURA_STATUS_LEARNING_MODEL || secrets.AURA_STATUS_INVESTIGATOR_MODEL || vars.AURA_STATUS_INVESTIGATOR_MODEL || vars.CHANGELOG_ANTHROPIC_MODEL || vars.CHANGELOG_MEDIA_ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AURA_STATUS_ENVIRONMENT: production
          AURA_STATUS_SOURCE: desktop-stable-release-learning
        run: npm run status:learn

      - name: Upload desktop observability artifacts
        if: always() && matrix.target == 'macos' && matrix.arch == 'aarch64' && steps.desktop_observability.outputs.ran == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: desktop-observability-stable-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            desktop-observability-checks
            desktop-observability-investigations
            desktop-observability-lessons
            desktop-observability-logs
          if-no-files-found: ignore

      - name: Build desktop observability snapshot
        if: always() && matrix.target == 'macos' && matrix.arch == 'aarch64' && steps.desktop_observability.outputs.ran == 'true'
        env:
          AURA_STATUS_CHECKS_DIR: desktop-observability-checks
          AURA_STATUS_INVESTIGATIONS_DIR: desktop-observability-investigations
          AURA_STATUS_PREVIOUS_SNAPSHOT: infra/evals/reports/status/previous/status.json
          AURA_STATUS_ENVIRONMENT: production
          AURA_STATUS_SOURCE: desktop-stable-release
        shell: bash
        run: |
          mkdir -p infra/evals/reports/status/previous
          git fetch origin +gh-pages:refs/remotes/origin/gh-pages || true
          git show origin/gh-pages:observability/status.json \
            > infra/evals/reports/status/previous/status.json || true
          npm run status:snapshot

      - name: Persist desktop observability history
        id: persist_desktop_observability_history
        if: always() && matrix.target == 'macos' && matrix.arch == 'aarch64' && steps.desktop_observability.outputs.ran == 'true'
        continue-on-error: true
        env:
          AURA_STORAGE_URL: ${{ vars.AURA_STORAGE_URL || 'https://aura-storage.onrender.com' }}
          AURA_STORAGE_INTERNAL_TOKEN: ${{ secrets.AURA_STORAGE_INTERNAL_TOKEN || secrets.INTERNAL_SERVICE_TOKEN }}
          AURA_STATUS_SNAPSHOT_FILE: infra/evals/reports/status/status.json
          AURA_STATUS_PERSIST_REQUIRED: "1"
          AURA_STATUS_ENVIRONMENT: production
          AURA_STATUS_SOURCE: desktop-stable-release
          AURA_STATUS_RELEASE_CHANNEL: stable
        run: npm run status:persist

      - uses: actions/checkout@v5
        if: always() && matrix.target == 'macos' && matrix.arch == 'aarch64' && steps.desktop_observability.outputs.ran == 'true' && steps.persist_desktop_observability_history.outcome == 'success'
        with:
          ref: gh-pages
          fetch-depth: 0
          path: desktop-observability-pages

      - name: Publish desktop observability snapshot
        if: matrix.target == 'macos' && matrix.arch == 'aarch64' && steps.desktop_observability.outputs.ran == 'true' && steps.persist_desktop_observability_history.outcome == 'success'
        shell: bash
        run: |
          mkdir -p desktop-observability-pages/observability
          cp infra/evals/reports/status/status.json desktop-observability-pages/observability/status.json
          bash infra/scripts/release/commit-gh-pages-with-retry.sh \
            desktop-observability-pages \
            "Update desktop observability status snapshot" \
            observability/status.json

      - name: Package installer
        env:
          AURA_DESKTOP_USE_PREBUILT_FRONTEND: "1"
          AURA_UPDATE_BASE_URL: ${{ env.AURA_UPDATE_BASE_URL }}
        shell: bash
        run: |
          set -o pipefail

          package_once() {
            # cargo-packager 0.11.8 does not accept cargo build flags
            # (--no-default-features / --features) directly. The stable-channel
            # binary is produced earlier in this package job, then consumed via
            # the `binaries-dir = "../../../.aura-shared-target/release"` entry
            # that the prepare-packager step injects into Cargo.toml. The
            # `before-packaging-command` line is stripped above so cargo-packager
            # does not redundantly rebuild on top of the prebuilt binary.
            cargo packager --release --packages aura-os-desktop 2>&1 | tee packager.log
          }

          should_retry_packaging() {
            # macOS: retry on transient DMG creation flakes, and on transient
            # HTTP failures from Apple's notary service (notarytool surfaces
            # 5xx / 429 as `HTTP status code: NNN`).
            if [ "${{ matrix.target }}" = "macos" ] \
              && grep -Eiq "hdiutil: .*Resource busy|resource is being held|resource temporarily unavailable|HTTP status code: (429|5[0-9][0-9])" packager.log; then
              return 0
            fi

            if [ "${{ matrix.target }}" = "linux" ] \
              && grep -Eq "ERROR .*: status code (429|5[0-9][0-9])" packager.log; then
              return 0
            fi

            if [ "${{ matrix.target }}" = "windows" ] \
              && grep -Eq "ERROR .*: status code (429|5[0-9][0-9])" packager.log; then
              return 0
            fi

            return 1
          }

          cleanup_retryable_packaging_failure() {
            if [ "${{ matrix.target }}" = "macos" ]; then
              python3 infra/scripts/release/cleanup-stale-macos-dmg.py
              bash infra/scripts/release/install-patched-create-dmg.sh
            fi

            rm -f packager.log
            sleep 5
          }

          max_attempts=3
          attempt=1

          while ! package_once; do
            if [ "$attempt" -ge "$max_attempts" ] || ! should_retry_packaging; then
              exit 1
            fi

            attempt=$((attempt + 1))
            echo "Retrying packaging after transient platform packaging failure (attempt ${attempt}/${max_attempts})..."
            cleanup_retryable_packaging_failure
          done

      - name: Notarize and validate macOS DMG
        if: matrix.target == 'macos'
        shell: bash
        run: bash infra/scripts/release/macos-dmg-notarize-validate.sh --notarize "$AURA_RELEASE_DIR"

      - name: Collect artifacts
        id: artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "$AURA_RELEASE_DIR"/*.{exe,dmg,AppImage,deb} dist/ 2>/dev/null || true
          cp "$AURA_RELEASE_DIR"/*.app.tar.gz dist/ 2>/dev/null || true
          cp -R "$AURA_RELEASE_DIR"/*.app dist/ 2>/dev/null || true
          cp "$AURA_RELEASE_DIR"/*-setup*.exe dist/ 2>/dev/null || true
          cp "$AURA_RELEASE_DIR"/*.sig dist/ 2>/dev/null || true
          cp "$AURA_RELEASE_DIR"/bundle/*/*.{exe,dmg,AppImage,deb} dist/ 2>/dev/null || true
          cp "$AURA_RELEASE_DIR"/bundle/*/*.app.tar.gz dist/ 2>/dev/null || true
          cp -R "$AURA_RELEASE_DIR"/bundle/*/*.app dist/ 2>/dev/null || true
          cp "$AURA_RELEASE_DIR"/bundle/*/*-setup*.exe dist/ 2>/dev/null || true
          cp "$AURA_RELEASE_DIR"/bundle/*/*.sig dist/ 2>/dev/null || true
          if [ "${{ matrix.target }}" = "windows" ]; then
            rm -f dist/aura-os-desktop.exe dist/aura-os-desktop.exe.sig
          fi
          if [ "${{ matrix.target }}" = "macos" ]; then
            for bundle in dist/*.app.tar.gz; do
              [ -e "$bundle" ] || continue
              renamed="dist/aura-os-desktop_${{ steps.version.outputs.version }}_${{ matrix.arch }}.app.tar.gz"
              mv "$bundle" "$renamed"
              if [ -f "${bundle}.sig" ]; then
                mv "${bundle}.sig" "${renamed}.sig"
              fi
            done
            if ! ls dist/*.app.tar.gz >/dev/null 2>&1; then
              for app_bundle in dist/*.app; do
                [ -e "$app_bundle" ] || continue
                archive_path="dist/aura-os-desktop_${{ steps.version.outputs.version }}_${{ matrix.arch }}.app.tar.gz"
                COPYFILE_DISABLE=1 tar -czf "$archive_path" -C dist "$(basename "$app_bundle")"
                break
              done
            fi
          fi
          ls -la dist/
          echo "dir=dist" >> "$GITHUB_OUTPUT"

      - name: Normalize signing key
        shell: bash
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
        run: |
          normalized="$(python3 infra/scripts/release/normalize-packager-key.py)"
          if [ -n "$normalized" ]; then
            echo "CARGO_PACKAGER_SIGN_PRIVATE_KEY=$normalized" >> "$GITHUB_ENV"
          fi

      - name: Sign packaged updater artifacts
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ env.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: node infra/scripts/release/desktop-sign-artifacts.mjs --dir dist --prune-app-bundles

      - name: Generate artifact summary and checksums
        shell: bash
        run: |
          node infra/scripts/release/desktop-release-summary.mjs dist stable "${{ steps.version.outputs.version }}"
          mv dist/release-summary.json "dist/release-summary-${{ matrix.target }}-${{ matrix.arch }}.json"
          mv dist/release-summary.md "dist/release-summary-${{ matrix.target }}-${{ matrix.arch }}.md"
          mv dist/checksums.txt "dist/checksums-${{ matrix.target }}-${{ matrix.arch }}.txt"
          cat "dist/release-summary-${{ matrix.target }}-${{ matrix.arch }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate signed release artifacts
        shell: bash
        run: |
          node infra/scripts/release/desktop-release-artifacts-validate.mjs \
            --dist dist \
            --channel stable \
            --version "${{ steps.version.outputs.version }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/

  validate-artifacts:
    needs: package
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Node.js
        uses: ./.github/actions/setup-node

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: all-artifacts
          merge-multiple: true

      - name: Validate artifact versions
        run: |
          node infra/scripts/release/validate-release-artifact-versions.mjs \
            --artifacts-dir all-artifacts \
            --channel stable \
            --version "${{ github.event.inputs.version }}" \
            --output-dir validation

      - name: Dry-run release asset reconciliation
        shell: bash
        run: |
          bash infra/scripts/release/upload-release-assets-with-retry.sh \
            --dry-run \
            "${{ github.repository }}" \
            "v${{ github.event.inputs.version }}" \
            all-artifacts

      - name: Generate preview update manifests
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="v${VERSION}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          generate_manifest() {
            local target=$1 arch=$2 filename=$3 format=$4
            local sig_file="all-artifacts/${filename}.sig"
            local signature='""'
            if [ -f "$sig_file" ]; then
              signature=$(jq -Rs . < "$sig_file")
            fi

            mkdir -p "stable/${target}"
            cat > "stable/${target}/${arch}.json" <<MANIFEST
          {
            "version": "${VERSION}",
            "url": "${BASE_URL}/${filename}",
            "signature": ${signature},
            "format": "${format}"
          }
          MANIFEST
          }

          generate_manifest "windows" "x86_64" "aura-os-desktop_${VERSION}_x64-setup.exe" "nsis"
          generate_manifest "macos" "aarch64" "aura-os-desktop_${VERSION}_aarch64.app.tar.gz" "app"
          generate_manifest "macos" "x86_64" "aura-os-desktop_${VERSION}_x86_64.app.tar.gz" "app"
          generate_manifest "linux" "x86_64" "aura-os-desktop_${VERSION}_x86_64.AppImage" "appimage"

          mkdir -p downloads
          cat > downloads/stable.json <<MANIFEST
          {
            "channel": "stable",
            "version": "${VERSION}",
            "release_url": "https://github.com/${{ github.repository }}/releases/tag/${TAG}",
            "generated_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "desktop": {
              "windows": {
                "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/aura-os-desktop_${VERSION}_x64-setup.exe"
              },
              "mac": {
                "apple-silicon": {
                  "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/AURA_${VERSION}_aarch64.dmg"
                },
                "intel": {
                  "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/AURA_${VERSION}_x64.dmg"
                }
              },
              "linux": {
                "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/aura-os-desktop_${VERSION}_x86_64.AppImage"
              }
            }
          }
          MANIFEST

      - name: Validate preview manifests
        run: |
          node infra/scripts/release/desktop-manifest-validate.mjs \
            --root-dir . \
            --channel stable \
            --output-dir validation

      - name: Validate preview download manifest
        run: |
          node infra/scripts/release/desktop-downloads-validate.mjs \
            --manifest downloads/stable.json \
            --artifacts-dir all-artifacts \
            --channel stable \
            --output-dir validation

      - name: Attach validation summary
        shell: bash
        run: |
          {
            echo "## Stable Validation Mode"
            echo ""
            echo "- Publish skipped because this manual run used publish_live=false."
            echo ""
            cat validation/artifact-versions-stable.md
            echo ""
            cat validation/desktop-manifests-stable.md
            echo ""
            cat validation/desktop-downloads-stable.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation manifests
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: stable-validation-manifests
          path: |
            stable/**
            downloads/**
            validation/**

  release:
    needs: package
    if: github.event_name != 'workflow_dispatch' || inputs.publish_live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: all-artifacts
          merge-multiple: true

      - name: Write release metadata
        shell: bash
        run: |
          mkdir -p release-metadata
          jq -n \
            --arg channel stable \
            --arg workflow "Desktop Stable Release" \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg tag "${{ steps.version.outputs.tag }}" \
            --arg release_url "https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}" \
            '{
              channel: $channel,
              workflow: $workflow,
              version: $version,
              tag: $tag,
              release_url: $release_url
            }' > release-metadata/release-metadata.json

      - name: Upload release metadata
        uses: actions/upload-artifact@v5
        with:
          name: release-metadata
          path: release-metadata/release-metadata.json

      - name: Create GitHub Release
        id: release_stable
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: AURA ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: all-artifacts/**/*

      - name: Reconcile stable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash infra/scripts/release/upload-release-assets-with-retry.sh \
            "${{ github.repository }}" \
            "${{ steps.version.outputs.tag }}" \
            all-artifacts

      - name: Attach release summary to job
        shell: bash
        run: |
          shopt -s nullglob
          for file in all-artifacts/release-summary-*.md; do
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
          done

  publish-manifests:
    needs: [package, release]
    if: github.event_name != 'workflow_dispatch' || inputs.publish_live
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: repo

      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 0
          path: pages

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 25.9.0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: all-artifacts
          merge-multiple: true

      - name: Generate update manifests
        shell: bash
        run: |
          cd repo
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          generate_manifest() {
            local target=$1 arch=$2 filename=$3 format=$4
            local sig_file="../all-artifacts/${filename}.sig"
            local signature='""'
            if [ -f "$sig_file" ]; then
              signature=$(jq -Rs . < "$sig_file")
            fi

            mkdir -p "../pages/stable/${target}"
            cat > "../pages/stable/${target}/${arch}.json" <<MANIFEST
          {
            "version": "${VERSION}",
            "url": "${BASE_URL}/${filename}",
            "signature": ${signature},
            "format": "${format}"
          }
          MANIFEST
          }

          generate_manifest "windows" "x86_64" "aura-os-desktop_${VERSION}_x64-setup.exe" "nsis"
          generate_manifest "macos" "aarch64" "aura-os-desktop_${VERSION}_aarch64.app.tar.gz" "app"
          generate_manifest "macos" "x86_64" "aura-os-desktop_${VERSION}_x86_64.app.tar.gz" "app"
          generate_manifest "linux" "x86_64" "aura-os-desktop_${VERSION}_x86_64.AppImage" "appimage"

          mkdir -p "../pages/downloads"
          cat > "../pages/downloads/stable.json" <<MANIFEST
          {
            "channel": "stable",
            "version": "${VERSION}",
            "release_url": "https://github.com/${{ github.repository }}/releases/tag/${TAG}",
            "generated_at": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "desktop": {
              "windows": {
                "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/aura-os-desktop_${VERSION}_x64-setup.exe"
              },
              "mac": {
                "apple-silicon": {
                  "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/AURA_${VERSION}_aarch64.dmg"
                },
                "intel": {
                  "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/AURA_${VERSION}_x64.dmg"
                }
              },
              "linux": {
                "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/aura-os-desktop_${VERSION}_x86_64.AppImage"
              }
            }
          }
          MANIFEST

      - name: Validate stable update manifests
        run: |
          cd repo
          node infra/scripts/release/desktop-manifest-validate.mjs \
            --root-dir ../pages \
            --channel stable \
            --output-dir ../manifest-validation

      - name: Validate stable download manifest
        run: |
          cd repo
          node infra/scripts/release/desktop-downloads-validate.mjs \
            --manifest ../pages/downloads/stable.json \
            --artifacts-dir ../all-artifacts \
            --channel stable \
            --output-dir ../manifest-validation

      - name: Attach stable manifest summary
        shell: bash
        run: |
          cat manifest-validation/desktop-manifests-stable.md >> "$GITHUB_STEP_SUMMARY"
          cat manifest-validation/desktop-downloads-stable.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push manifests
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stable/ downloads/stable.json
          git diff --cached --quiet || git commit -m "Update stable manifests for ${{ steps.version.outputs.version }}"
          git push
