name: AURA API container

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "apps/aura-os-server/**"
      - "crates/**"
      - "vendor/chromiumoxide/**"
      - ".github/workflows/aura-api-container.yml"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "apps/aura-os-server/**"
      - "crates/**"
      - "vendor/chromiumoxide/**"
      - ".github/workflows/aura-api-container.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-api-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aura-api:ci
          cache-from: type=gha,scope=aura-api
          cache-to: type=gha,mode=max,scope=aura-api

      - name: Verify Chromium/CDP startup and API health
        shell: bash
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1::10000 aura-api:ci)"
          trap 'docker logs "$container_id"; docker rm --force "$container_id" >/dev/null' EXIT

          host_port="$(docker port "$container_id" 10000/tcp | sed 's/.*://')"
          for _ in $(seq 1 60); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:${host_port}/api/auth/session" || true)"
            if [ "$status" = "401" ]; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
              echo "aura-api exited before becoming healthy" >&2
              exit 1
            fi
            sleep 1
          done

          echo "aura-api did not become healthy within 60 seconds" >&2
          exit 1

      - name: Verify container runs as an unprivileged user
        shell: bash
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' aura-api:ci)" = "aura"
