[package]
name = "aura-os-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aura-os-core = { path = "../../crates/aura-os-core", default-features = false }
aura-os-server = { path = "../aura-os-server", default-features = false, features = ["browser-cdp"] }
aura-os-ide = { path = "../aura-os-ide" }
aura-os-store = { path = "../../crates/aura-os-store" }
aura-os-integrations = { path = "../../crates/aura-os-integrations" }
axum = { workspace = true }
base64 = { workspace = true }
wry = "0.54"
tao = "0.34"
tokio = { workspace = true }
dirs = { workspace = true }
dotenvy = "0.15"
image = "0.25.10"
rfd = "0.15.1"
open = "5"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
cargo-packager-updater = "0.2"
# Computer-use executor (src/computer_use): `enigo` synthesizes real OS
# mouse/keyboard input (Windows SendInput / macOS CGEvent / Linux) and `xcap`
# captures the full desktop to an `image::RgbaImage`. Both are cross-platform
# and replace ~hundreds of lines of per-OS unsafe FFI we'd otherwise hand-roll,
# so they earn their place per the lean-dependency rule. Pinned to versions
# compatible with the workspace rust-version (enigo 0.6+ requires rustc 1.85).
enigo = "0.3.0"
xcap = "0.9.6"

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Threading", "Win32_Security"] }
# Windows Graphics Capture backend for the demo recorder's framed window
# mode: captures the demo window's composited surface directly (by HWND), so
# the recording includes GPU-rendered WebView2 content (gdigrab `title=` is
# all-black for it) and follows the window as it moves/resizes/is occluded —
# none of which a fixed gdigrab screen region can do. Ships its own
# Media-Foundation H.264 encoder, replacing a large amount of WinRT +
# Direct3D + Sink Writer FFI we would otherwise hand-roll.
windows-capture = "2"

# Embeds an `RT_GROUP_ICON` (and matching version info) into the produced
# `aura-os-desktop.exe` so the Start Menu, File Explorer, "pin to taskbar"
# tile, and Alt+Tab fallback all show the AURA orb. Without this, those
# surfaces fall back to the generic Windows executable glyph because they
# read the icon from disk, not from the runtime `with_window_icon` HICON.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Freedesktop/XDG notifications over D-Bus for Ubuntu and other Unix desktops
# that expose a notification daemon. Pinned below latest because notify-rust
# 4.18 raised MSRV past the workspace rust-version; 4.12 supports Rust 1.63+
# and still ships the same D-Bus notification surface we need.
notify-rust = { version = "=4.12.0", default-features = false, features = ["z"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block2 = "0.6"
muda = "0.15"
# Used by `updater::bundle_path` to inspect the running .app bundle's
# filesystem flags (MNT_RDONLY) so we can detect App Translocation /
# read-only DMG mounts before `cargo-packager-updater` fails mid-install
# with `Read-only file system (os error 30)`.
libc = "0.2"

[features]
default = ["dev-channel"]
# Build-time channel selector. `dev-channel` is the default so plain
# `cargo run -p aura-os-desktop` (and any other unqualified cargo invocation)
# produces a Dev binary with parallel-but-distinct identifiers (window
# title "AURA Dev", `aura-dev` data dir, dev ports, dev single-instance
# mutex, dev skills tree, in-app updater disabled). This lets a developer
# run a dev build alongside an installed stable AURA without either
# stomping on the other's files, ports, or single-instance lock.
#
# Stable (published-installer) binaries are produced exclusively by the
# release pipeline, which passes the explicit
# `--no-default-features --features stable-channel` flag in every place
# that builds for distribution:
#   - `scripts/ci/verify-desktop.mjs` (also asserts the built binary
#      self-reports `channel=Stable` via `--print-channel`)
#   - `.github/workflows/release-stable.yml`
#   - `.github/workflows/release-nightly.yml`
#   - the `before-packaging-command` line below (used by `cargo packager`)
#
# CRITICAL invariant: every other crate in the workspace that depends on
# `aura-os-core` MUST use `default-features = false`, and the
# `aura-os-core` crate itself has no default channel. Otherwise Cargo
# feature unification will silently activate `aura-os-core/dev-channel`
# through a transitive library dep and turn the "stable" build into a
# Dev-in-disguise binary at runtime (same mutex, same `aura-dev` data
# dir, "AURA Dev" window title). That regression is what the
# `--print-channel` CI check in `scripts/ci/verify-desktop.mjs` exists
# to catch. The `stable-channel` arm of `Channel::current()` wins over
# `dev-channel` for the same reason — so even if a future audit slip
# re-activates `dev-channel` transitively, a build that *also* has
# `stable-channel` on still resolves to Stable.
dev-channel = ["aura-os-core/dev-channel", "aura-os-server/dev-channel"]
stable-channel = ["aura-os-core/stable-channel", "aura-os-server/stable-channel"]

[package.metadata.packager]
product-name = "AURA"
identifier = "com.aura.desktop"
category = "DeveloperTool"
icons = [
    # 1024px must use the `@2x` suffix so cargo-packager's icns generator
    # treats it as the 512x512 retina (`ic10`) slot. icns has no entry for
    # `(1024, 1024, density=1)`, so without the suffix `cargo packager` aborts
    # the macOS .app build with `No matching IconType`.
    "assets/icons/icon-1024@2x.png",
    "assets/icons/icon-512.png",
    "assets/icons/icon-256.png",
    "assets/icons/icon-128.png",
    "assets/icons/icon-64.png",
    "assets/icons/icon-32.png",
    "assets/icons/icon-16.png",
]
before-packaging-command = "cargo build --release --no-default-features --features stable-channel --package aura-os-desktop"
resources = ["../../interface/dist", "resources"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
installer-icon = "assets/installer/installer-icon.ico"
header-image = "assets/installer/header-dark.bmp"
sidebar-image = "assets/installer/sidebar-dark.bmp"
template = "assets/installer/installer.tera.nsi"

[package.metadata.packager.dmg]
background = "assets/installer/dmg-background.png"

[package.metadata.packager.macos]
minimum-system-version = "10.15"

[lints.clippy]
all = "warn"

[lints.rust]
unsafe_code = "allow"
